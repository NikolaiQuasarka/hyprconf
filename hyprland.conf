################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1.0


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
# $menu = wofi --show drun -i
$menu = fuzzel
$browser = zen-browser
$monitor = btop
$bar =
# $widget-system = nix-shell ~/.config/quickshell/shell.nix --run quickshell
$widget-system =  qs -c noctalia-shell --no-duplicate
$ipc = qs -c noctalia-shell ipc call
$editor = $terminal nvim
$notify-system = swaync


#################
### AUTOSTART ###
#################
# hyprpaper=1,~/Изображения/Wallpers/5377e955a06a6.jpg
# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = $widget-system & hyprpaper & systemctl --user start hyprpolkitagent & kbuildsycoca6 & hypridle & hyprsunset

#Clipboard
# exec-once = wl-paste --type text --watch cliphist store # Stores only text data
# exec-once = wl-paste --type image --watch cliphist store # Stores only image data
#exec-once = [workspace special:magic silent] $monitor & telegram
exec-once = systemctl start --user app-Flameshot@autostart.service

